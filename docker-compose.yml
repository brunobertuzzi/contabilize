services:
  # ----------------------------------------------------------------------------
  # Banco de Dados Relacional PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: contabilize_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contabilize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contabilize_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-contabilize_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contabilize} -d ${POSTGRES_DB:-contabilize_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contabilize_net

  # ----------------------------------------------------------------------------
  # Aplicação Web Contabilize (Flask + Gunicorn + TypeScript)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contabilize_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-contabilize_production_secret_key_change_me_in_env_file_64_chars}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-contabilize}:${POSTGRES_PASSWORD:-contabilize_secure_password_2026}@db:5432/${POSTGRES_DB:-contabilize_db}
      LOG_LEVEL: INFO
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - contabilize_uploads:/app/uploads
    networks:
      - contabilize_net

volumes:
  postgres_data:
    driver: local
  contabilize_uploads:
    driver: local

networks:
  contabilize_net:
    driver: bridge
