<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops! Ocorreu um problema - Contabilize</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card border text-center" style="max-width: 520px; border-radius: 1rem;">
        <div class="card-body p-4 p-md-5">
            <div class="mb-4">
                <div class="icon-circle bg-danger bg-opacity-10 text-danger mx-auto d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; border-radius: 50%;">
                    <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                </div>
            </div>
            <h1 class="h3 fw-bold text-dark mb-2">Ops! Algo não saiu como esperado</h1>
            <p class="text-muted mb-4 lead fs-6">
                {{ error_message or "Ocorreu um erro interno ao processar sua solicitação. Não se preocupe, seus dados estão seguros." }}
            </p>
            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                <a href="/" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house-door me-2"></i>Ir para o Painel
                </a>
                <button onclick="window.history.back()" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-arrow-left me-2"></i>Voltar
                </button>
            </div>
        </div>
    </div>
</body>

</html>
